name: Build tippecanoe artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "42 5 1 * *"  # Run on the 1st of each month at 5:42 AM UTC

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      is_new_version: ${{ steps.check.outputs.is_new_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fetch the latest tag from the felt/tippecanoe repository
          TAG=$(gh release list --exclude-drafts --exclude-pre-releases -R felt/tippecanoe --json tagName --jq ".[0].tagName")
          echo "TAG = $TAG"

          if [[ -z "$TAG" ]]; then
            echo "Error: No tags found in felt/tippecanoe repository."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Force rebuild for push and workflow_dispatch triggers
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "Trigger: $EVENT_NAME - forcing rebuild"
            exit 0
          fi

          # For scheduled runs, check if the tag already exists
          if gh release view -R michaelkreil/tippecanoe-action "$TAG" > /dev/null 2>&1; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            echo "No new version found"
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "New version found, will build"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.is_new_version == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: darwin
            arch: arm64

    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.check-version.outputs.tag }}

    steps:
      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make libsqlite3-dev zlib1g-dev

      - name: Build tippecanoe
        run: |
          curl -L "https://github.com/felt/tippecanoe/archive/refs/tags/$TAG.tar.gz" | tar xz
          cd "tippecanoe-$TAG"
          make -j
          tar -czf ~/tippecanoe-${{ matrix.os }}-${{ matrix.arch }}.tar.gz tile-join tippecanoe tippecanoe-enumerate tippecanoe-decode tippecanoe-json-tool tippecanoe-overzoom

      - name: Test binaries
        run: |
          cd "tippecanoe-$TAG"

          # Test that all binaries run
          ./tippecanoe --version
          ./tile-join --version
          ./tippecanoe-decode --version
          ./tippecanoe-enumerate --version
          ./tippecanoe-json-tool --help
          ./tippecanoe-overzoom --version

          # Functional test: convert GeoJSON to mbtiles
          echo '{"type":"Feature","geometry":{"type":"Point","coordinates":[0,0]},"properties":{"name":"test"}}' > test.geojson
          ./tippecanoe -o test.mbtiles -z5 -Z0 --no-feature-limit --no-tile-size-limit test.geojson

          # Verify output exists and is valid
          test -f test.mbtiles
          ./tippecanoe-decode test.mbtiles | head -20

          echo "All tests passed!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tippecanoe-${{ matrix.os }}-${{ matrix.arch }}
          path: ~/tippecanoe-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload binaries
        run: |
          # Create release, ignoring error if it already exists
          gh release create --latest --title "$TAG" "$TAG" || true

          # Upload all artifacts to the release
          for file in artifacts/*/*.tar.gz; do
            echo "Uploading $file"
            gh release upload "$TAG" "$file" --clobber
          done
